[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rootkeepers-collector"
version = "0.1.0"
description = "npm install 인터셉트 기반 공급망 신뢰도 검사기 (Track A/B/C 계보 수집 + 규칙 엔진)"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "langgraph>=1.0.0",
    "pydantic>=2.7.0",
    "PyGithub>=2.9.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
sast = ["semgrep>=1.100.0"]
openai = ["openai>=2.0.0"]

[project.scripts]
trustgate = "rootkeepers.cli:main"
safe-npm = "rootkeepers.interceptor.__main__:main"
safe-npm-setup = "rootkeepers.interceptor.shim_installer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rootkeepers = [
    "analysis/rules/*.yml",
    "dashboard/static/*.html",
    "dashboard/static/*.css",
    "dashboard/static/*.js",
    "dashboard/static/fonts/*.woff2",
]

[tool.pytest.ini_options]
markers = [
    "live_ai: 실제 OpenAI Responses API를 한 번 호출하는 선택 통합 테스트",
    "live_groq: Groq Free tier API를 한 번 호출하는 선택 통합 테스트",
    "live_malware: 격리 환경에서만 실행하는 선택형 악성 패키지 정적 분석 테스트",
]
