# TrustGate 실행:
#     docker compose up -d --build
#     → http://localhost:8000
#
# 필요한 것:
#   1) 루트 .env 에 GITHUB_TOKEN=...  (레포에 커밋되지 않음)
#   2) 검사할 프로젝트 경로를 .env 의 TRUSTGATE_PROJECT_DIR 로 지정 (선택)
#
# 서비스는 하나뿐이다. 콘솔이 스캔·판정·설치·이력 보관을 모두 담당하고,
# 터미널의 safe-npm CLI 도 이 콘솔로 결과를 보낸다.

services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
    image: trustgate-console:0.1
    container_name: trustgate-console
    restart: unless-stopped
    ports:
      # 모든 인터페이스에 노출 (0.0.0.0). VM에서도 접근 가능.
      # ⚠️ 이 콘솔은 인증이 없고 패키지 설치를 실행할 수 있으므로
      #    신뢰된 네트워크에서만 노출하세요.
      - "0.0.0.0:8000:8000"
    environment:
      TRUSTGATE_PROJECT_DIR: /workspace
      TRUSTGATE_DB_PATH: /data/history.sqlite3
      # 토큰은 이미지에 굽지 않고 실행 시 주입한다 (.env 에서 읽음)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # 기준선 수집 범위: off | npm(추가 호출 0회) | sigstore(릴리스당 1회)
      TRUSTGATE_BASELINE: ${TRUSTGATE_BASELINE:-sigstore}
    volumes:
      # 검사할 프로젝트. .env 의 TRUSTGATE_PROJECT_DIR 로 바꾼다.
      - ${TRUSTGATE_PROJECT_DIR:-./examples/demo-project}:/workspace
      # 이력 DB. 이게 없으면 컨테이너를 다시 만들 때 기록이 전부 사라진다.
      - trustgate-data:/data

volumes:
  trustgate-data:
